; PlatformIO Project Configuration File
; Two targets share this project: src/main.cpp (Teensy 4.0) and src/espmain.cpp (ESP32).
;   pio run -e teensy40 -t upload
;   pio run -e esp32 -t upload

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_src_filter = +<*> -<espmain.cpp> -<espsimple.cpp>

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp> -<espsimple.cpp>

; Software upload over WiFi (no BOOT button, no cable): pio run -e esp32_ota -t upload
[env:esp32_ota]
extends = env:esp32
upload_protocol = espota
; The board announces itself as imu.local. If your computer cannot resolve that, give its
; address instead:  pio run -e esp32_ota -t upload --upload-port 192.168.1.50   (python boardfind.py finds it)
upload_port = imu.local
upload_flags = --auth=imuota

; The simple firmware (src/main.cpp) on the ESP32: no WiFi, no tracking. Over USB only:
;   pio run -e esp32_simple -t upload --upload-port COM8
[env:esp32_simple]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<espsimple.cpp>
