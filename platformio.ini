; PlatformIO Project Configuration File
; Two targets share this project: src/main.cpp (Teensy 4.0) and src/espmain.cpp (ESP32).
;   pio run -e teensy40 -t upload
;   pio run -e esp32 -t upload

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_src_filter = +<*> -<espmain.cpp>

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp>

; Software upload over WiFi (no BOOT button, no cable): pio run -e esp32_ota -t upload
[env:esp32_ota]
extends = env:esp32
upload_protocol = espota
upload_port = 192.168.137.200
upload_flags = --auth=imuota
